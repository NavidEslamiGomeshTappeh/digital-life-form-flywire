name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "ruff>=0.13,<1" "build>=1,<2"
          python -m pip install -e . --no-deps
      - name: Validate
        run: python -m dlf_flywire validate
      - name: Lint
        run: python -m ruff check .
      - name: Build
        run: python -m build
      - name: Wheel install smoke test
        run: |
          python -m pip install dist/*.whl --no-deps
          dlf-flywire validate
      - name: Publish build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digital-life-form-${{ github.ref_name }}
          path: dist/*
