name: V229 verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile v229_recovery_runner.py scripts/v230_zenodo_exact_probe.py
      - name: Unit tests
        run: python test_v229_recovery_runner.py
      - name: V230 artifact validation
        run: python test_v230_target_synapses.py
      - name: Dependency imports
        run: |
          python -m pip install -r requirements.txt
          python -c "import fafbseg, navis, pyarrow; print('PASS: runtime dependencies import')"

  network-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Network probe
        run: python scripts/network_probe.py --strict
