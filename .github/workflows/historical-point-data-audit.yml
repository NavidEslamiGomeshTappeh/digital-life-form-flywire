name: Historical and Zenodo Point_data binary audit

on:
  push:
    branches: [audit/decode-historical-point-data]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas jax jaxlib
      - name: Decode historical and Zenodo Point_data
        run: python scripts/audit_point_data_binary.py
      - name: Upload audit receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-and-zenodo-point-data-audit
          path: point_data_binary_audit.json
