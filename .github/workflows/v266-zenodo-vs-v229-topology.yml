name: V266 Zenodo vs V229 Topology Audit

on:
  push:
    branches: ["v266-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run V266 audit and regression tests
        working-directory: scripts
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q test_v266_zenodo_vs_v229_topology.py
