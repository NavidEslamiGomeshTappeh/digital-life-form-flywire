name: V247 neuropil count provenance
on:
  push:
    branches: [v247-neuropil-count-provenance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install "polars>=1.30,<2" pytest
      - run: python -m pytest -q scripts/test_v247_neuropil_count_provenance.py
      - name: Download Princeton connections
        run: |
          curl --fail --location --retry 8 --retry-all-errors --output /tmp/connections_princeton.csv.gz "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
          gzip -t /tmp/connections_princeton.csv.gz
      - name: Compare per-neuropil counts
        run: |
          python scripts/v247_neuropil_count_provenance.py --source /tmp/connections_princeton.csv.gz --target v230_results/V230_target_synapses.csv --output /tmp/V247.json
      - uses: actions/upload-artifact@v4
        with:
          name: V247-neuropil-count-provenance
          path: /tmp/V247.json
          retention-days: 90

# trigger: v247 rerun after workflow registration
