name: FlyDrones Integration

on:
  push:
    branches: [main]
    paths:
      - "src/dlf_flywire/flydrones_adapter.py"
      - "src/dlf_flywire/neural_gateway.py"
      - "scripts/flydrones_integration_smoke.py"
      - "tests/test_flydrones_adapter.py"
      - ".github/workflows/flydrones-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/dlf_flywire/flydrones_adapter.py"
      - "src/dlf_flywire/neural_gateway.py"
      - "scripts/flydrones_integration_smoke.py"
      - "tests/test_flydrones_adapter.py"
      - ".github/workflows/flydrones-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flydrones-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Digital Life Form
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps

      - name: Fetch pinned FlyDrones source
        env:
          FLYDRONES_REVISION: 6519c8c0e35ae829faa98a5a02033343dd0b82d4
        run: |
          git clone --filter=blob:none https://github.com/SpikeCalls/FlyDrones.git .ci/flydrones
          test "$(git -C .ci/flydrones rev-parse "$FLYDRONES_REVISION^{commit}")" = "$FLYDRONES_REVISION"
          git -C .ci/flydrones checkout --detach "$FLYDRONES_REVISION"
          python -m pip install .ci/flydrones

      - name: Run real FlyDrones -> Digital Life Form smoke test
        env:
          PYTHONPATH: src
        run: python scripts/flydrones_integration_smoke.py
