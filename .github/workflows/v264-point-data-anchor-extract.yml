name: V264 Point_data Anchor Extraction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install historical pickle dependencies
        run: python -m pip install --disable-pip-version-check pandas "jax>=0.4.0" "jaxlib>=0.4.0"

      - name: Download immutable Point_data from Zenodo archive
        env:
          ZENODO_URL: https://zenodo.org/records/21876510/files/T4_T5_dendrite_morphology_data.zip?download=1
          POINT_BLOB: b85caf49f45677f2075f7b5f2c8830141cd96d02
        run: |
          curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 \
            "$ZENODO_URL" \
            -o /tmp/T4_T5_dendrite_morphology_data.zip
          test -s /tmp/T4_T5_dendrite_morphology_data.zip
          POINT_PATH="$(unzip -Z1 /tmp/T4_T5_dendrite_morphology_data.zip | awk '$0 ~ /(^|\/)point_data\.pkl$/ {print; exit}')"
          test -n "$POINT_PATH"
          echo "Point_data archive path: $POINT_PATH"
          unzip -p /tmp/T4_T5_dendrite_morphology_data.zip "$POINT_PATH" > /tmp/Point_data.pkl
          test -s /tmp/Point_data.pkl
          test "$(git hash-object -t blob /tmp/Point_data.pkl)" = "$POINT_BLOB"
          test "$(sha256sum /tmp/Point_data.pkl | cut -d ' ' -f 1)" = "76b7d6a1c44ad6b2ca730feff88174c71327e095cce45d8a47a0d998f77df58f"

      - name: Extract four anchors
        run: python scripts/v264_point_data_anchor_extract.py

      - uses: actions/upload-artifact@v4
        with:
          name: V264-Point-data-anchor-rows
          path: v264_results/V264_Point_data_anchor_rows.json
