name: V251 Codex connection-count provenance
on:
  push:
    branches: [v251-codex-buhmann-count-provenance]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Codex v783 connections
        run: curl --fail --location --retry 8 --retry-all-errors -o /tmp/connections.csv.gz 'https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections.csv.gz'
      - name: Compare V230 pair counts
        run: python scripts/v251_codex_connection_count_provenance.py --source /tmp/connections.csv.gz --target v230_results/V230_target_synapses.csv --output /tmp/V251.json
      - uses: actions/upload-artifact@v4
        with: {name: V251-codex-connection-count-provenance, path: /tmp/V251.json, retention-days: 90}