name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "ruff>=0.13,<1" "build>=1,<2"
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Tests
        run: python -m pytest -q
      - name: Agent runtime doctor smoke test
        run: python -m dlf_flywire doctor --json
      - name: Code Hand real-file smoke test
        run: |
          cat > "$RUNNER_TEMP/code-hand-plan.json" <<'JSON'
          {
            "steps": [
              {
                "step_id": "create-file",
                "capability": "runtime.python",
                "action": "Code Hand create a real Python source file",
                "destination": "repository-workspace",
                "risk_tier": 0,
                "permission_granted": true,
                "operation_args": [
                  "-c",
                  "from pathlib import Path; source='def add(a, b):'+chr(10)+'    return a + b'+chr(10); p=Path('code_hand_demo.py'); p.write_text(source, encoding='utf-8'); print('CREATED', p); print('BYTES', p.stat().st_size)"
                ],
                "idempotent": true
              },
              {
                "step_id": "test-file",
                "capability": "runtime.python",
                "action": "Code Hand test the generated Python source",
                "destination": "repository-workspace",
                "risk_tier": 0,
                "permission_granted": true,
                "dependencies": ["create-file"],
                "operation_args": [
                  "-c",
                  "from code_hand_demo import add; assert add(2, 3) == 5; assert add(-2, 5) == 3; print('CODE_HAND_TEST_PASS')"
                ],
                "idempotent": true
              }
            ]
          }
          JSON
          dlf-flywire run-plan "$RUNNER_TEMP/code-hand-plan.json"             --run-id ci-code-hand             --state-root "$RUNNER_TEMP/code-hand-state"
          echo '--- CREATE FILE RECEIPT ---'
          cat "$RUNNER_TEMP/code-hand-state/receipts/ci-code-hand/create-file.json"
          echo '--- TEST FILE RECEIPT ---'
          cat "$RUNNER_TEMP/code-hand-state/receipts/ci-code-hand/test-file.json"
          echo '--- GENERATED FILE ---'
          cat code_hand_demo.py
      - name: Canonical validation
        run: python -m dlf_flywire validate
      - name: Provenance audit
        run: python -m dlf_flywire audit
      - name: Distribution build
        run: python -m build
      - name: Wheel install smoke test
        run: |
          python -m pip install dist/*.whl --no-deps
          dlf-flywire validate
