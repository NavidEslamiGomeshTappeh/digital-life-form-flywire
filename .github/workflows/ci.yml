name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "ruff>=0.13,<1" "build>=1,<2"
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Tests
        run: python -m pytest -q
      - name: Canonical validation
        run: python -m dlf_flywire validate
      - name: Distribution build
        run: python -m build
      - name: Wheel install smoke test
        run: |
          python -m pip install dist/*.whl --no-deps
          dlf-flywire validate
