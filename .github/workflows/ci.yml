name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "ruff>=0.13,<1" "build>=1,<2"
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Tests
        run: python -m pytest -q
      - name: Agent runtime doctor smoke test
        run: python -m dlf_flywire doctor --json
      - name: Agent runtime end-to-end smoke test
        run: |
          cat > "$RUNNER_TEMP/dlf-runtime-plan.json" <<'JSON'
          {
            "steps": [
              {
                "step_id": "e2e",
                "capability": "runtime.python",
                "action": "run end-to-end runtime smoke test",
                "destination": "local-process",
                "risk_tier": 0,
                "permission_granted": true,
                "operation_args": ["-c", "print('dlf-e2e-ok')"],
                "idempotent": true
              }
            ]
          }
          JSON
          dlf-flywire run-plan "$RUNNER_TEMP/dlf-runtime-plan.json"             --run-id ci-e2e             --state-root "$RUNNER_TEMP/dlf-runtime-state"
      - name: Canonical validation
        run: python -m dlf_flywire validate
      - name: Provenance audit
        run: python -m dlf_flywire audit
      - name: Distribution build
        run: python -m build
      - name: Wheel install smoke test
        run: |
          python -m pip install dist/*.whl --no-deps
          dlf-flywire validate
