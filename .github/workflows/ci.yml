name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "ruff>=0.13,<1" "build>=1,<2"
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Tests
        run: python -m pytest -q
      - name: Agent runtime doctor smoke test
        run: python -m dlf_flywire doctor --json
      - name: Code Hand real-file smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          from dlf_flywire.code_hand import CodeHand

          hand = CodeHand(Path.cwd(), "$RUNNER_TEMP/code-hand-state")
          result = hand.execute(
              "code_hand_demo.py",
              "def add(a, b):\n    return a + b\n",
              "assert add(2, 3) == 5\nassert add(-2, 5) == 3",
              run_id="ci-code-hand",
              permission_granted=True,
          )
          print(result.to_dict()["verification"])
          for name, receipt in result.receipts.items():
              print(f"--- {name} receipt ---")
              print(receipt.to_dict())
          print("--- generated file ---")
          print(Path(result.file_path).read_text(encoding="utf-8"), end="")
          PY
      - name: Canonical validation
        run: python -m dlf_flywire validate
      - name: Provenance audit
        run: python -m dlf_flywire audit
      - name: Distribution build
        run: python -m build
      - name: Wheel install smoke test
        run: |
          python -m pip install dist/*.whl --no-deps
          dlf-flywire validate
