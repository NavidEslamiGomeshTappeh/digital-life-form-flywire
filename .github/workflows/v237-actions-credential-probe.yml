name: V237 Actions credential boundary probe

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

jobs:
  credential-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
    steps:
      - name: Read-only service probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          def probe(url, token, headers=None):
              if not token:
                  return {"status": "UNKNOWN", "http_status": None, "count": None}
              h = dict(headers or {})
              h["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=h, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read()
                      data = json.loads(body)
                      if isinstance(data, list):
                          count = len(data)
                      elif isinstance(data, dict) and isinstance(data.get("projects"), list):
                          count = len(data["projects"])
                      else:
                          count = None
                      return {"status": "PASS" if r.status == 200 else "FAIL",
                              "http_status": r.status, "count": count}
              except urllib.error.HTTPError as e:
                  return {"status": "FAIL", "http_status": e.code, "count": None}
              except Exception:
                  return {"status": "FAIL", "http_status": None, "count": None}

          supabase = probe(
              "https://api.supabase.com/v1/projects",
              os.environ.get("SUPABASE_ACCESS_TOKEN"),
          )

          neon_url = "https://console.neon.tech/api/v2/projects?limit=400"
          org_id = os.environ.get("NEON_ORG_ID")
          if org_id:
              neon_url += "&org_id=" + urllib.parse.quote(org_id, safe="")
          neon = probe(neon_url, os.environ.get("NEON_API_KEY"),
                       {"Accept": "application/json"})

          evidence = {
              "schema": "V237-actions-credential-probe/v1",
              "supabase": supabase,
              "neon": neon,
          }
          with open("v237_service_evidence.json", "w", encoding="utf-8") as f:
              json.dump(evidence, f, indent=2, sort_keys=True)
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: v237-service-evidence-${{ github.run_id }}
          path: v237_service_evidence.json
          retention-days: 90
