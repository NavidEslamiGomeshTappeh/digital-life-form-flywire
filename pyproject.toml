[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-life-form-flywire"
version = "1.3.0"
description = "Provenance-first FlyWire v783 morphology, synapse validation, and reproducible circuit evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Navid Eslami Gomesh Tappeh"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.13,<1",
  "build>=1,<2",
]

[project.scripts]
dlf-flywire = "dlf_flywire.cli:main"
dlf-flywire-recover = "dlf_flywire.recovery:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
