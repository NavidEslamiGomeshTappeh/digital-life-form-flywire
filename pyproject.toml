[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-life-form-flywire"
version = "1.7.1"
description = "Provenance-first FlyWire/FAFB connectomics evidence, morphology validation, reproducible FlyVis vision experiments, and guarded neural-agent runtime."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Navid Eslami Gomesh Tappeh" }]
keywords = [
  "flywire",
  "fafb",
  "connectomics",
  "neuroscience",
  "flyvis",
  "computer-vision",
  "neural-circuits",
  "provenance",
  "reproducibility",
  "research-software",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
[project.urls]
Homepage = "https://github.com/NavidEslamiGomeshTappeh/digital-life-form-flywire"
Repository = "https://github.com/NavidEslamiGomeshTappeh/digital-life-form-flywire"
Documentation = "https://github.com/NavidEslamiGomeshTappeh/digital-life-form-flywire/tree/main/docs"
Issues = "https://github.com/NavidEslamiGomeshTappeh/digital-life-form-flywire/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.13,<1",
  "build>=1,<2",
]
vision = [
  "opencv-python>=4.10,<6",
]
ptz = [
  "onvif-python==0.4.4",
]

[project.scripts]
dlf-flywire = "dlf_flywire.cli:main"
dlf-flywire-recover = "dlf_flywire.recovery:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
